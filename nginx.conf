events {
    worker_connections 1024;
}

http {
    # 1. Определяем доверенные IP-адреса наших внутренних узлов Nginx
    geo $is_trusted {
        default     0;
        10.10.10.11 1; # nginx1
        10.10.10.12 1; # nginx2
        10.10.10.13 1; # nginx3
    }

    # 2. Логика защиты от спуфинга X-Forwarded-For
    map $is_trusted $forwarded_for {
        0       $remote_addr;
        1       "$http_x_forwarded_for, $remote_addr";
    }

    server {
        listen 80;

        # Применяем сформированный безопасный заголовок
        proxy_set_header X-Forwarded-For $forwarded_for;

        # Прямой доступ к приложению
        location / {
            proxy_pass http://app:80;
        }

        # Маршруты для проверки цепочек проксирования
        location /to-n1/ {
            proxy_pass http://10.10.10.11:80/;
        }

        location /to-n2/ {
            proxy_pass http://10.10.10.12:80/;
        }

        location /to-n3/ {
            proxy_pass http://10.10.10.13:80/;
        }
    }
}
