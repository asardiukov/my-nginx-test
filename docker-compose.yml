services:
  nginx1:
    image: nginx:alpine
    container_name: nginx1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      test_net:
        ipv4_address: 10.10.10.11
    ports:
      - "8081:80"
    depends_on:
      - nginx2
      - nginx3
      - app

  nginx2:
    image: nginx:alpine
    container_name: nginx2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      test_net:
        ipv4_address: 10.10.10.12
    depends_on:
      - app

  nginx3:
    image: nginx:alpine
    container_name: nginx3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      test_net:
        ipv4_address: 10.10.10.13
    depends_on:
      - app

  app:
    image: traefik/whoami
    container_name: app
    networks:
      test_net:

networks:
  test_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
